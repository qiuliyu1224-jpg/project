name: Package VoteLab team test release

on:
  push:
    branches: [codex/votelab-045]
    paths:
      - .github/workflows/votelab-release.yml
      - voting-system/**
      - README.md

permissions:
  contents: read

concurrency:
  group: votelab-team-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run regression tests on Windows
        shell: pwsh
        working-directory: voting-system
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the test dependencies.' }
          python -m unittest discover -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows regression tests failed.' }
      - name: Build and verify the Windows ZIP
        shell: pwsh
        run: ./voting-system/release/build-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: votelab-windows-x64
          path: artifacts/*.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.chip }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            chip: Apple Silicon
          - runner: macos-15-intel
            arch: x86_64
            chip: Intel
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build and verify the macOS ZIP
        env:
          VOTELAB_MACOS_ARCH: ${{ matrix.arch }}
        run: bash voting-system/release/macos/build-macos.sh voting-system artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: votelab-macos-${{ matrix.arch }}
          path: artifacts/*.zip
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: votelab-v0.4.5-team-test
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the tested archives as a team prerelease
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -- 'spark*.py' | grep -q .; then
            echo 'The release source archive must contain VoteLab files only.'
            exit 1
          fi
          ls -l artifacts
          (cd artifacts && test "$(find . -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 3 && sha256sum *.zip > SHA256SUMS.txt)
          if status=$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish --jq '[.isDraft,.targetCommitish] | @tsv'); then
            IFS=$'\t' read -r draft target <<< "$status"
            if [[ "$draft" != true || "$target" != "$GITHUB_SHA" ]]; then
              echo 'Existing release is already published or points to a different commit.'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease \
              --title 'VoteLab 0.4.5 — Team test' --notes-file voting-system/release/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" artifacts/*.zip artifacts/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease

